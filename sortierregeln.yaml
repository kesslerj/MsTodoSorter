# Laden-Praefixe vor dem Produktnamen. "GG" = Gut & Guenstig von Edeka.
praefixe:
  aldi: aldi
  edeka: edeka
  gg: edeka

# Schreibweisen von Alexa. Links klein geschrieben, gesucht wird ohne
# Ruecksicht auf Gross/klein. Rechts steht, wie es in der Liste erscheinen
# soll. Der erkannte Eintrag erscheint ausserdem in der Schreibweise von oben
# ("Zwei magerquark" -> "Zwei Magerquark"), bei der Weiterleitung von Alexa
# und beim Sortieren.
schreibweisen:
  "t. k. ": "TK "
  "t.k. ": "TK "
  # Andere Namen fuer Eintraege oben
  "geschirrtabs": "Spülmaschinentabs"
  "sour cream": "Sour Creme"

# Mengenangaben vorne. Eine Zahl ("2", "2,5", "2x") oder eine Folge von
# Zahlwoertern, auch zusammengeschrieben ("fuenfhundert"), optional mit
# Groesse und Einheit ("ein kleiner Sack"). Ohne Zahl zaehlt eine Groesse
# nur mit Einheit ("kleiner Sack"), "Grosse Moehren" bleibt der Name.
# Danach muss ein Leerzeichen folgen.
mengen:
  zahlwoerter: [ein, eine, einen, eins, zwei, drei, vier, fünf, sechs, sieben,
                acht, neun, zehn, elf, zwölf, zwanzig, dreißig, vierzig, fünfzig,
                hundert, tausend, und, halb, halbe, halbes, halben, anderthalb]
  einheiten: [g, gr, gramm, kg, kilo, kilogramm, l, liter, ml, stück, stk,
              packung, packungen, pack, päckchen, dose, dosen, flasche, flaschen,
              becher, tüte, tüten, glas, gläser, bund, stange, stangen, beutel,
              netz, sack, säcke, säckchen]
  groessen: [klein, kleine, kleiner, kleines, kleinen, groß, große, großer,
             großes, großen, gross, grosse, grosser, grosses, grossen, mittel,
             mittlere, mittlerer, mittleres, mittleren]
