# Sortierregeln fuer die Einkaufsliste in MS To Do.
#
# Quelle ist diese Datei in der HA-Config (einkaufsliste/sortierregeln.yaml).
# Eine Kopie liegt im Repo kesslerj/MsTodoSorter, dort liest sort_todos.py
# dieselbe Datei. Nach jeder Aenderung hier die Kopie im Repo nachziehen.
#
# Zuordnung (custom_templates/einkaufsliste.jinja und sort_todos.py):
# 1. Text glaetten: Leerzeichen zusammengefasst, "schreibweisen" ersetzt, klein.
# 2. Mengenangabe vorne abschneiden ("2x", "500g", "fuenf hundert gramm").
# 3. Ein Eintrag passt, wenn der Rest gleich ist oder mit Eintrag + Leerzeichen
#    beginnt ("Joghurt Natur" passt zu "Joghurt", "Joghurteis" nicht).
#    Bei mehreren Treffern in einem Laden gewinnt der laengste Eintrag, bei
#    Treffern in mehreren Laeden der erste Laden.
# 4. Ohne Treffer zaehlt ein Laden-Praefix ("Edeka Bionade", "GG ..."): der
#    Eintrag kommt an den Anfang dieses Ladens.
# 5. Sonst unsortiert.
#
# Reihenfolge der Laeden und Eintraege = Reihenfolge in der Liste.

unsortiert:
  trenner: "----------- UNSORTIERT -----------"

